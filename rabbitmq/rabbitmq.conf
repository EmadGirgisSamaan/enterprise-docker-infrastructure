# Loaded as /etc/rabbitmq/conf.d/20-custom.conf (read-only mount)

# Keep RabbitMQ well inside the container memory limit (512m)
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 256MB

# Log to stdout so `docker compose logs rabbitmq` works
log.console = true
log.console.level = info
