# Enterprise Docker Infrastructure: Security, Isolation & Hardening
# NGINX -> Tomcat (vprofile) -> MariaDB / Memcached / RabbitMQ
#
# Run:   docker compose up -d --build
# Check: docker compose ps   (all five services must report "healthy")

x-hardened: &hardened
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  # ---------------------------------------------------------------- NGINX
  nginx:
    <<: *hardened
    build: ./nginx
    user: "101:101"                        # UID of nginx-unprivileged
    ports:
      - "80:8080"                          # the ONLY published port
    networks: [frontend]
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --------------------------------------------------------------- TOMCAT
  app:
    <<: *hardened
    build: ./app
    user: "10001:10001"
    networks: [frontend, backend]
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER}
      RABBITMQ_USER: ${RABBITMQ_USER}
    secrets:
      - db_password
      - rabbitmq_password
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
      - /usr/local/tomcat/temp:uid=10001,gid=10001
      - /usr/local/tomcat/work:uid=10001,gid=10001
      - /usr/local/tomcat/logs:uid=10001,gid=10001
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      # vprofile has no /health endpoint, so /login (HTTP 200) is used instead
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://localhost:8080/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  # -------------------------------------------------------------- MARIADB
  db:
    <<: *hardened
    image: mariadb:10.11
    user: mysql                            # use the image's own non-root user
    networks:
      backend:
        aliases: [db01]                    # hostname the app expects
    environment:
      MARIADB_DATABASE: accounts
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_password
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
      - ./db/db_backup.sql:/docker-entrypoint-initdb.d/db_backup.sql:ro
    mem_limit: 512m
    cpus: 0.75
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ------------------------------------------------------------ MEMCACHED
  memcached:
    <<: *hardened
    image: memcached:1.6-alpine
    user: memcache
    command: ["-m", "64"]
    networks:
      backend:
        aliases: [mc01]
    read_only: true
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD-SHELL", "echo stats | nc -w1 127.0.0.1 11211 | grep -q uptime"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ------------------------------------------------------------- RABBITMQ
  rabbitmq:
    <<: *hardened
    image: rabbitmq:3-alpine               # no management UI, nothing to expose
    user: rabbitmq
    networks:
      backend:
        aliases: [rmq01]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS_FILE: /run/secrets/rabbitmq_password
    secrets:
      - rabbitmq_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-custom.conf:ro
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

networks:
  frontend:
  backend:
    internal: true                         # no route to the outside world

volumes:
  db_data:
  rabbitmq_data:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_root_password:
    file: ./secrets/db_root_password.txt
  rabbitmq_password:
    file: ./secrets/rabbitmq_password.txt
